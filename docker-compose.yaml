services:
  app:
    build:
      context: ./back-matcha
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      NB_FAKE_PROFILE: ${NB_FAKE_PROFILE}
    networks:
      - webapp-net
    container_name: matcha_app
      
  db:
    build:
      context: ./postgreSQL
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d matcha_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webapp-net
    container_name: matcha_db
    restart: always

  front:
    build:
      context: ./front-matcha
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    volumes:
      - ./front-matcha:/app
      - /app/node_modules
    depends_on:
      - app
    networks:
      - webapp-net
    container_name: matcha_front

volumes:
  postgres_data:

networks:
  webapp-net:
    driver: bridge
